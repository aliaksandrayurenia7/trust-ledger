name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-retries=20

    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_URL: redis://127.0.0.1:6379/0
      PLATFORM_FEE_PERCENT: 5
      RISK_REVIEW_THRESHOLD: 70
      RISK_EXTENDED_HOLD_THRESHOLD: 40

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare the database
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: Lint
        run: bundle exec rubocop

      - name: Security scan
        run: bundle exec brakeman --no-pager --quiet

      - name: Tests
        run: bundle exec rspec
